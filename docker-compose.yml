# 正式部署：docker compose up -d --build
# 首次啟動後執行 docker compose exec backend python -m app.bootstrap 建總管理員
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vtuber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: vtuber_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtuber -d vtuber_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vtuber:${POSTGRES_PASSWORD}@db:5432/vtuber_db
      SECRET_KEY: ${SECRET_KEY:?請在 .env 設定 SECRET_KEY}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      CORS_ORIGINS: ""  # 前端由 nginx 同源代理，不需要跨來源
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
