[tool.poetry]
name = "vtuber-backend"
version = "0.1.0"
description = "VTuber merch management system backend"
authors = ["malingsuo <djsojdn1285@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.139.2"
uvicorn = {extras = ["standard"], version = "^0.51.0"}
sqlalchemy = "^2.0.51"
alembic = "^1.18.5"
psycopg = {extras = ["binary"], version = "^3.3.4"}
pydantic-settings = "^2.14.2"
numpy = "^2.5.1"
scipy = "^1.18.0"
pyjwt = "^2.13.0"
bcrypt = "^5.0.0"
openpyxl = "^3.1.5"
python-multipart = "^0.0.32"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
